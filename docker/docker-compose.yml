version: "3.9"

services:
  ml-service:
    build:
      context: ..
      dockerfile: docker/mlservice.Dockerfile
    ports:
      - "5001:5001"

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    depends_on:
      - ml-service

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
